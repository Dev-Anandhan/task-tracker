<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Survival Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen pb-20 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-gray-50 border-x border-gray-200/60 shadow-xl relative">

        <!-- Sticky ADHD Header -->
        <header
            class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200/80 px-4 pt-4 pb-3 shadow-xs">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20 text-sm">
                        ⚡
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold text-gray-900 tracking-tight leading-none">Placement
                            Survival Tracker</h1>
                        <p class="text-[11px] font-medium text-gray-500 mt-0.5">3-Day Sprint & Master Routine</p>
                    </div>
                </div>
                <button id="reset-day-btn" title="Reset current day's progress"
                    class="text-xs text-gray-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-gray-100 transition-colors flex items-center gap-1 font-medium">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Reset</span>
                </button>
            </div>

            <!-- Current Day Info & Progress -->
            <div class="bg-gray-50 rounded-xl p-3 border border-gray-200/70 mt-1">
                <div class="flex justify-between items-baseline mb-2">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <span id="day-badge"
                            class="px-2 py-0.5 text-[10px] font-extrabold rounded-md bg-blue-100 text-blue-800 tracking-wide uppercase flex-shrink-0">Day
                            1</span>
                        <h2 id="day-title" class="text-xs font-bold text-gray-700 truncate">DeltaX & Predigle Focus</h2>
                    </div>
                    <div class="flex items-baseline gap-1 flex-shrink-0 ml-2">
                        <span id="tasks-fraction" class="text-[11px] text-gray-400 font-semibold">0/0</span>
                        <span id="progress-percent" class="text-sm font-black text-blue-600 transition-colors">0%</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar-fill"
                        class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-all duration-300 ease-out"
                        style="width: 0%"></div>
                </div>
            </div>

            <!-- Horizontal Day Selector -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-3 pb-1 -mx-4 px-4 snap-x snap-mandatory"
                id="days-nav">
                <!-- Injected via JavaScript -->
            </div>
        </header>

        <!-- Main Schedule Container -->
        <main class="flex-1 p-4 space-y-4" id="blocks-container">
            <!-- Time blocks injected via JavaScript -->
        </main>

        <!-- Parked Thoughts / Distraction Dump (ADHD Anchor) -->
        <footer class="p-4 pt-2">
            <div class="bg-amber-50/80 rounded-2xl p-4 border border-amber-200/80 shadow-xs">
                <div class="flex items-center justify-between mb-1.5">
                    <div class="flex items-center gap-2">
                        <span class="text-base">⚡</span>
                        <label for="scratchpad" class="text-xs font-bold text-amber-900 tracking-wide">
                            Parked Thoughts / Distractions
                        </label>
                    </div>
                    <span id="save-status" class="text-[10px] text-amber-600 font-medium">Saved</span>
                </div>
                <p class="text-[11px] text-amber-800/80 mb-2.5 leading-relaxed">
                    When a random thought tries to derail your focus, dump it here and return directly to your work.
                </p>
                <textarea id="scratchpad" rows="3"
                    placeholder="When a random thought tries to derail your focus, dump it here and return to work."
                    class="w-full bg-white/90 border border-amber-200/90 rounded-xl p-3 text-xs text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition resize-none shadow-2xs"></textarea>
            </div>
            <p class="text-center text-[11px] text-gray-400 mt-4 font-medium">
                Placement Survival Tracker • ADHD Optimized
            </p>
        </footer>
    </div>

    <script>
        // --- ICONS (Clean SVG Strings) ---
        const ICONS = {
            bus: `<svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`,
            code: `<svg class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>`,
            target: `<svg class="w-4 h-4 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>`,
            food: `<svg class="w-4 h-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V4a2 2 0 114 0v4m-4 0h4m-8 0a2 2 0 00-2 2v7a2 2 0 002 2h2V8H6z" /></svg>`,
            gym: `<svg class="w-4 h-4 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" /></svg>`,
            moon: `<svg class="w-4 h-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>`,
            sun: `<svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`,
            check: `<svg class="w-3.5 h-3.5 text-white stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`
        };

        // --- SCHEDULE DATA BUILDER ---
        function buildDay(id, dayName, shortName, tag, isSprint, isWeekend, deepWorkTasks, drillTasks, eveningTasks = []) {
            const blocks = [];

            // 1. Morning Block
            if (isWeekend) {
                blocks.push({
                    title: "Morning Routine",
                    time: "07:30 - 09:30",
                    icon: ICONS.sun,
                    tasks: [
                        { id: `${id}_m1`, text: "Wake up at 07:30 AM & drink 500ml water" },
                        { id: `${id}_m2`, text: "Light morning walk / movement" },
                        { id: `${id}_m3`, text: "Review weekly goals over breakfast" }
                    ]
                });
            } else {
                blocks.push({
                    title: "Morning Launch & Commute",
                    time: "05:30 - 09:30",
                    icon: ICONS.bus,
                    tasks: [
                        { id: `${id}_m1`, text: "Wake up at 05:30 AM & drink 500ml water" },
                        { id: `${id}_m2`, text: "Walk 1.8km to bus stop & board by 06:40 AM" },
                        { id: `${id}_m3`, text: "Bus transit (06:40 - 09:30): Audiobooks or rest" }
                    ]
                });
            }

            // 2. Deep Work (College Block)
            blocks.push({
                title: "Deep Work (College Block)",
                time: "09:30 - 12:50",
                icon: ICONS.code,
                tasks: deepWorkTasks.map((t, idx) => ({ id: `${id}_dw_${idx}`, text: t }))
            });

            // 3. Lunch & Recharge
            blocks.push({
                title: "Lunch & Recharge",
                time: "12:50 - 14:00",
                icon: ICONS.food,
                tasks: [
                    { id: `${id}_l1`, text: "Eat nutritious lunch" },
                    { id: `${id}_l2`, text: "Zero screen time reset" }
                ]
            });

            // 4. Afternoon Placement Drill
            blocks.push({
                title: "Afternoon Placement Drill",
                time: "14:00 - 15:00",
                icon: ICONS.target,
                tasks: drillTasks.map((t, idx) => ({ id: `${id}_dr_${idx}`, text: t }))
            });

            // 5. Transit & Pre-Gym
            if (isWeekend) {
                blocks.push({
                    title: "Afternoon & Pre-Gym",
                    time: "15:00 - 18:00",
                    icon: ICONS.food,
                    tasks: [
                        { id: `${id}_t1`, text: "Relaxation / Hobby time" },
                        { id: `${id}_t2`, text: "Pre-gym snack + Take Zinc & Creatine" }
                    ]
                });
            } else {
                blocks.push({
                    title: "Transit & Pre-Gym",
                    time: "15:00 - 18:00",
                    icon: ICONS.bus,
                    tasks: [
                        { id: `${id}_t1`, text: "Leave college at 3:00 PM" },
                        { id: `${id}_t2`, text: "Arrive home by 4:40 PM" },
                        { id: `${id}_t3`, text: "Pre-gym snack + Take Zinc & Creatine" }
                    ]
                });
            }

            // 6. Physical Training
            blocks.push({
                title: "Physical Training",
                time: "18:00 - 19:30",
                icon: ICONS.gym,
                tasks: [
                    { id: `${id}_g1`, text: "Gym Workout (Weight training / Cardio)" }
                ]
            });

            // 7. Evening Review
            const eveningBase = [
                "Dinner & Shower",
                "Push code to GitHub & Update Mistake Log"
            ];
            blocks.push({
                title: "Evening Review",
                time: "19:30 - 21:30",
                icon: ICONS.code,
                tasks: [...eveningBase, ...eveningTasks].map((t, idx) => ({ id: `${id}_ev_${idx}`, text: t }))
            });

            // 8. Wind Down & Sleep
            blocks.push({
                title: "Wind Down & Sleep",
                time: "21:30 - 22:30",
                icon: ICONS.moon,
                tasks: [
                    { id: `${id}_w1`, text: "Take Magnesium L-Threonate" },
                    { id: `${id}_w2`, text: "Pack bag & set out clothes for tomorrow" },
                    { id: `${id}_w3`, text: "Screens off & Lights out by 10:30 PM" }
                ]
            });

            return { id, dayName, shortName, tag, isSprint, isWeekend, blocks };
        }

        const SCHEDULE_DATA = [
            buildDay(
                "wed", "Wednesday", "Wed", "Day 1: DeltaX & Predigle Focus", true, false,
                [
                    "Review OS: Scheduling, Deadlocks, Paging",
                    "Review Networks & DBMS: OSI Layers, TCP/UDP, ACID",
                    "Write 5 complex SQL queries (DISTINCT, GROUP BY, CTEs)"
                ],
                [
                    "Take 45-minute timed MCQ Mock Test (50 Questions)"
                ],
                [
                    "Review incorrect MCQ answers from afternoon mock test"
                ]
            ),
            buildDay(
                "thu", "Thursday", "Thu", "Day 2: Coding Endurance", true, false,
                [
                    "120-Min Mock: Solve 5 LC problems (Arrays/Strings/Trees)",
                    "Review mock solutions & optimize time complexity"
                ],
                [
                    "Pickyourtrail Drill: Build Stack & Queue using Arrays from scratch",
                    "Write function to reverse string without built-ins"
                ],
                [
                    "Practice BFS/DFS tree traversals on paper"
                ]
            ),
            buildDay(
                "fri", "Friday", "Fri", "Day 3: Final Polish", true, false,
                [
                    "STAR Method: Verbal explanation of top 2 AI/DS projects out loud",
                    "Predigle Prep: Review ETL pipelines & API model serving",
                    "Review how ML models are served via APIs"
                ],
                [
                    "Verbal Drill: Explain Polymorphism & REST APIs out loud"
                ],
                [
                    "Review syntax cheatsheets only (No heavy new coding)"
                ]
            ),
            buildDay(
                "sat", "Saturday", "Sat", "Day 4: Assessment & Recovery", false, true,
                [
                    "Full 90-Minute Full Mock Assessment (Coding + Aptitude)",
                    "Review Mock Assessment solutions"
                ],
                [
                    "Resume & LinkedIn Optimization",
                    "Update Portfolio READMEs"
                ]
            ),
            buildDay(
                "sun", "Sunday", "Sun", "Day 5: Reset & Review", false, true,
                [
                    "Review Weekly Mistake Log thoroughly",
                    "Curate problem set for next week (DSA & SQL)"
                ],
                [
                    "Read tech blog or watch System Design video (Low stress)"
                ]
            ),
            buildDay(
                "mon", "Monday", "Mon", "Day 6: DSA Foundation", false, false,
                [
                    "DSA: Arrays, Hashing, & Two Pointers (2 Easy, 1 Med)",
                    "Core AI Math: Gradient Descent & Loss Functions"
                ],
                [
                    "SQL Drill: Window Functions & Aggregations"
                ]
            ),
            buildDay(
                "tue", "Tuesday", "Tue", "Day 7: ML & Systems", false, false,
                [
                    "DSA: Trees, Graphs, & Binary Search",
                    "ML Concepts: Supervised vs Unsupervised Algorithms"
                ],
                [
                    "Verbal STAR Method Drill: AI/ML Project Walkthrough"
                ]
            )
        ];

        // --- STATE MANAGEMENT ---
        const STORAGE_TASKS_KEY = "placement_survival_tasks_store";
        const STORAGE_ACTIVE_DAY_KEY = "placement_survival_active_day";
        const STORAGE_SCRATCHPAD_KEY = "placement_survival_scratchpad";

        let completedTasks = {};
        try {
            completedTasks = JSON.parse(localStorage.getItem(STORAGE_TASKS_KEY)) || {};
        } catch (e) {
            completedTasks = {};
        }

        let activeDayId = localStorage.getItem(STORAGE_ACTIVE_DAY_KEY) || "wed";
        if (!SCHEDULE_DATA.some(d => d.id === activeDayId)) {
            activeDayId = "wed";
        }

        // --- DOM NODES ---
        const daysNavEl = document.getElementById("days-nav");
        const blocksContainerEl = document.getElementById("blocks-container");
        const dayBadgeEl = document.getElementById("day-badge");
        const dayTitleEl = document.getElementById("day-title");
        const tasksFractionEl = document.getElementById("tasks-fraction");
        const progressPercentEl = document.getElementById("progress-percent");
        const progressBarFillEl = document.getElementById("progress-bar-fill");
        const scratchpadEl = document.getElementById("scratchpad");
        const saveStatusEl = document.getElementById("save-status");
        const resetDayBtn = document.getElementById("reset-day-btn");

        // --- SCRATCHPAD ---
        scratchpadEl.value = localStorage.getItem(STORAGE_SCRATCHPAD_KEY) || "";
        let saveTimeout = null;
        scratchpadEl.addEventListener("input", (e) => {
            saveStatusEl.textContent = "Saving...";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(STORAGE_SCRATCHPAD_KEY, e.target.value);
                saveStatusEl.textContent = "Saved";
            }, 300);
        });

        // --- PROGRESS LOGIC ---
        function updateProgress() {
            const currentDay = SCHEDULE_DATA.find(d => d.id === activeDayId);
            if (!currentDay) return;

            let totalTasks = 0;
            let completedCount = 0;

            currentDay.blocks.forEach(block => {
                block.tasks.forEach(task => {
                    totalTasks++;
                    if (completedTasks[task.id]) {
                        completedCount++;
                    }
                });
            });

            const percent = totalTasks === 0 ? 0 : Math.round((completedCount / totalTasks) * 100);

            tasksFractionEl.textContent = `${completedCount}/${totalTasks}`;
            progressPercentEl.textContent = `${percent}%`;
            progressBarFillEl.style.width = `${percent}%`;

            if (percent === 100) {
                progressPercentEl.classList.remove("text-blue-600");
                progressPercentEl.classList.add("text-emerald-600");
                progressBarFillEl.classList.remove("from-blue-500", "to-indigo-600");
                progressBarFillEl.classList.add("from-emerald-500", "to-teal-500");
            } else {
                progressPercentEl.classList.add("text-blue-600");
                progressPercentEl.classList.remove("text-emerald-600");
                progressBarFillEl.classList.add("from-blue-500", "to-indigo-600");
                progressBarFillEl.classList.remove("from-emerald-500", "to-teal-500");
            }
        }

        function toggleTask(taskId) {
            if (completedTasks[taskId]) {
                delete completedTasks[taskId];
            } else {
                completedTasks[taskId] = true;
            }
            try {
                localStorage.setItem(STORAGE_TASKS_KEY, JSON.stringify(completedTasks));
            } catch (e) { }

            renderTasks();
            updateProgress();
        }

        // --- RESET DAY ---
        resetDayBtn.addEventListener("click", () => {
            const currentDay = SCHEDULE_DATA.find(d => d.id === activeDayId);
            if (!currentDay) return;
            if (confirm(`Reset all checked tasks for ${currentDay.dayName}?`)) {
                currentDay.blocks.forEach(block => {
                    block.tasks.forEach(task => {
                        delete completedTasks[task.id];
                    });
                });
                localStorage.setItem(STORAGE_TASKS_KEY, JSON.stringify(completedTasks));
                renderTasks();
                updateProgress();
            }
        });

        // --- RENDER DAY BUTTONS ---
        function renderDayNav() {
            daysNavEl.innerHTML = "";
            SCHEDULE_DATA.forEach((day) => {
                const isSelected = day.id === activeDayId;
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `snap-start flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-150 active:scale-95 ${isSelected
                        ? "bg-blue-600 text-white shadow-md shadow-blue-500/25 scale-[1.02]"
                        : "bg-white text-gray-600 border border-gray-200 hover:bg-gray-100/80 hover:text-gray-900"
                    }`;

                let labelHtml = `<span>${day.shortName}</span>`;
                if (day.isSprint) {
                    labelHtml += `<span title="3-Day Sprint" class="text-xs ${isSelected ? 'opacity-100' : 'opacity-90'}">🔥</span>`;
                }

                btn.innerHTML = labelHtml;
                btn.addEventListener("click", () => {
                    activeDayId = day.id;
                    localStorage.setItem(STORAGE_ACTIVE_DAY_KEY, day.id);
                    renderDayNav();
                    renderTasks();
                    updateProgress();
                });

                daysNavEl.appendChild(btn);
            });
        }

        // --- RENDER TASKS ---
        function renderTasks() {
            const currentDay = SCHEDULE_DATA.find(d => d.id === activeDayId);
            if (!currentDay) return;

            // Update header details
            dayBadgeEl.textContent = currentDay.shortName;
            dayTitleEl.textContent = currentDay.tag;

            blocksContainerEl.innerHTML = "";

            currentDay.blocks.forEach(block => {
                const blockCard = document.createElement("div");
                blockCard.className = "bg-white rounded-2xl border border-gray-200/80 shadow-xs overflow-hidden transition-all duration-200";

                // Card Header
                const headerDiv = document.createElement("div");
                headerDiv.className = "px-4 py-3 bg-gray-50/70 border-b border-gray-100 flex items-center justify-between";
                headerDiv.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-xl bg-white border border-gray-200/80 flex items-center justify-center shadow-2xs">
              ${block.icon}
            </div>
            <div>
              <h3 class="text-xs font-bold text-gray-900 leading-snug">${block.title}</h3>
              <span class="text-[10px] font-semibold text-gray-500 tracking-tight">${block.time}</span>
            </div>
          </div>
        `;

                // Tasks Container
                const tasksList = document.createElement("div");
                tasksList.className = "p-2 divide-y divide-gray-100/70";

                block.tasks.forEach(task => {
                    const isDone = !!completedTasks[task.id];
                    const taskItem = document.createElement("div");
                    taskItem.className = `flex items-start gap-3 p-2.5 rounded-xl cursor-pointer transition-all duration-150 select-none ${isDone ? "bg-blue-50/30 opacity-70" : "hover:bg-gray-50 active:bg-gray-100/80"
                        }`;

                    taskItem.innerHTML = `
            <div class="flex-shrink-0 mt-0.5">
              <div class="w-5 h-5 rounded-lg border-2 flex items-center justify-center transition-all duration-150 ${isDone
                            ? "bg-blue-600 border-blue-600 shadow-xs shadow-blue-500/20"
                            : "border-gray-300 bg-white hover:border-blue-400"
                        }">
                ${isDone ? ICONS.check : ""}
              </div>
            </div>
            <p class="text-xs leading-relaxed font-medium transition-all duration-150 ${isDone ? "line-through text-gray-400" : "text-gray-800"
                        }">
              ${task.text}
            </p>
          `;

                    taskItem.addEventListener("click", () => toggleTask(task.id));
                    tasksList.appendChild(taskItem);
                });

                blockCard.appendChild(headerDiv);
                blockCard.appendChild(tasksList);
                blocksContainerEl.appendChild(blockCard);
            });
        }

        // --- INITIALIZE ---
        renderDayNav();
        renderTasks();
        updateProgress();
    </script>
</body>

</html>
