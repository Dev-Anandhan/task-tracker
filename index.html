<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Placement Survival Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Hide scrollbar for day selector */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Checkbox Animation */
        .check-circle {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="checkbox"]:checked + .check-circle {
            background-color: #10b981;
            border-color: #10b981;
        }
        input[type="checkbox"]:checked + .check-circle svg {
            opacity: 1;
            transform: scale(1);
        }
        input[type="checkbox"] + .check-circle svg {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-label {
            transition: color 0.2s;
        }
        input[type="checkbox"]:checked ~ .task-label {
            color: #9ca3af;
            text-decoration: line-through;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-24">
        
        <!-- Sticky Header with Progress -->
        <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-gray-100 pt-6 pb-4 px-5">
            <div class="flex justify-between items-end mb-3">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-gray-900">Placement Survival</h1>
                    <p class="text-xs text-gray-500 mt-0.5 font-medium" id="current-day-display">Wednesday</p>
                </div>
                <div class="text-right">
                    <span class="text-2xl font-bold text-emerald-600" id="progress-text">0%</span>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
            
            <!-- Day Selector -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar mt-5 pb-1 -mx-5 px-5" id="day-selector">
                <!-- Injected via JS -->
            </div>
        </header>

        <!-- Main Content (Time Blocks) -->
        <main class="px-5 py-6 space-y-6" id="blocks-container">
            <!-- Injected via JS -->
        </main>

        <!-- Parked Thoughts -->
        <div class="px-5 mt-4 mb-8">
            <div class="bg-amber-50 border border-amber-100 rounded-xl p-4">
                <div class="flex items-center gap-2 mb-2">
                    <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"></path></svg>
                    <h3 class="text-sm font-semibold text-amber-800">⚡ Parked Thoughts / Distractions</h3>
                </div>
                <textarea id="scratchpad" class="w-full bg-white/50 border border-amber-200/50 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white resize-none h-28 placeholder-amber-700/40 text-amber-900" placeholder="Dump random thoughts here to stay focused..."></textarea>
                <div class="text-right mt-1">
                    <span id="save-indicator" class="text-[10px] font-medium text-amber-600/0 transition-opacity duration-300">Saved</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ICONS = {
            morning: `<svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
            code: `<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>`,
            food: `<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>`,
            drill: `<svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`,
            bus: `<svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>`,
            gym: `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>`,
            review: `<svg class="w-5 h-5 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>`,
            sleep: `<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`
        };

        const DAYS = [
            { id: 'mon', name: 'Mon' },
            { id: 'tue', name: 'Tue' },
            { id: 'wed', name: 'Wed', sprint: true },
            { id: 'thu', name: 'Thu', sprint: true },
            { id: 'fri', name: 'Fri', sprint: true },
            { id: 'sat', name: 'Sat' },
            { id: 'sun', name: 'Sun' }
        ];

        // Generator for anchor blocks
        const getMorningBlock = (isWeekend) => ({
            id: 'b1', title: 'Morning Launch & Commute', time: isWeekend ? '07:30 - 09:30' : '05:30 - 09:30', icon: ICONS.morning,
            tasks: isWeekend ? [
                'Wake up at 07:30 AM & drink 500ml water',
                'Relaxation & light morning routine'
            ] : [
                'Wake up at 05:30 AM & drink 500ml water',
                'Walk 1.8km to bus stop & board by 06:40 AM',
                'Bus transit: Audiobooks or rest'
            ]
        });

        const getLunchBlock = () => ({
            id: 'b3', title: 'Lunch & Recharge', time: '12:50 - 14:00', icon: ICONS.food,
            tasks: ['Eat nutritious lunch', 'Zero screen time reset']
        });

        const getTransitBlock = (isWeekend) => ({
            id: 'b5', title: isWeekend ? 'Relaxation & Pre-Gym' : 'Transit & Pre-Gym', time: '15:00 - 18:00', icon: ICONS.bus,
            tasks: isWeekend ? [
                'Relaxation/Hobby time',
                'Pre-gym snack + Take Zinc & Creatine'
            ] : [
                'Leave college at 3:00 PM',
                'Arrive home by 4:40 PM',
                'Pre-gym snack + Take Zinc & Creatine'
            ]
        });

        const getGymBlock = () => ({
            id: 'b6', title: 'Physical Training', time: '18:00 - 19:30', icon: ICONS.gym,
            tasks: ['Gym Workout (Weight training / Cardio)']
        });

        const getSleepBlock = () => ({
            id: 'b8', title: 'Wind Down & Sleep', time: '21:30 - 22:30', icon: ICONS.sleep,
            tasks: [
                'Take Magnesium L-Threonate',
                'Pack bag & set out clothes for tomorrow',
                'Screens off & Lights out by 10:30 PM'
            ]
        });

        // Day specific data
        const SCHEDULE = {
            'mon': {
                b2: { title: 'Deep Work (College)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['DSA (Arrays, Hashing)', 'Core AI Math (Gradient Descent)'] },
                b4: { title: 'Afternoon Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['SQL Window Functions'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log'] }
            },
            'tue': {
                b2: { title: 'Deep Work (College)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['DSA (Trees, Graphs)', 'ML Concepts (Supervised/Unsupervised)'] },
                b4: { title: 'Afternoon Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Verbal STAR method drill'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log'] }
            },
            'wed': {
                b2: { title: 'Deep Work (DeltaX & Predigle)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['Review OS (Scheduling, Deadlocks)', 'Review Networks/DBMS (OSI, ACID)', 'Write 5 complex SQL queries (DISTINCT, GROUP BY)'] },
                b4: { title: 'Afternoon Drill (Mock Test)', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Take 45-minute timed MCQ Mock Test (50 Qs)'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log', 'Review incorrect MCQ answers'] }
            },
            'thu': {
                b2: { title: 'Deep Work (Endurance)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['120-Min Mock: Solve 5 LC problems (Arrays/Strings/Trees)', 'Review & optimize time complexity'] },
                b4: { title: 'Pickyourtrail Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Build Stack/Queue using Arrays from scratch', 'Reverse string without built-ins'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log', 'Practice BFS/DFS tree traversals on paper'] }
            },
            'fri': {
                b2: { title: 'Deep Work (Final Polish)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['STAR Method verbal explanation of top 2 AI/DS projects', 'Predigle Prep: Review ETL pipelines & API model serving'] },
                b4: { title: 'Verbal Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Explain Polymorphism & REST APIs out loud'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log', 'Review syntax cheatsheets only (no heavy coding)'] }
            },
            'sat': {
                b2: { title: 'Deep Work (Full Mock)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['Full 90-Min Mock Assessment', 'Review solutions'] },
                b4: { title: 'Afternoon Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Resume & LinkedIn optimization'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log'] }
            },
            'sun': {
                b2: { title: 'Deep Work (Review)', time: '09:30 - 12:50', icon: ICONS.code, tasks: ['Review Weekly Mistake Log', 'Curate problem sets'] },
                b4: { title: 'Afternoon Drill', time: '14:00 - 15:00', icon: ICONS.drill, tasks: ['Watch System Design video (low stress)'] },
                b7: { title: 'Evening Review', time: '19:30 - 21:30', icon: ICONS.review, tasks: ['Dinner & Shower', 'Push code to GitHub & Update Mistake Log'] }
            }
        };

        const generateDayData = (dayId) => {
            const isWeekend = dayId === 'sat' || dayId === 'sun';
            const spec = SCHEDULE[dayId];
            return [
                getMorningBlock(isWeekend),
                { id: 'b2', ...spec.b2 },
                getLunchBlock(),
                { id: 'b4', ...spec.b4 },
                getTransitBlock(isWeekend),
                getGymBlock(),
                { id: 'b7', ...spec.b7 },
                getSleepBlock()
            ];
        };

        // State Management
        const STATE_KEY = 'placement_survival_state';
        
        // Default to current day, ensuring valid ID
        let currentDayIdx = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
        let activeDay = DAYS[currentDayIdx].id;
        
        let checkedTasks = JSON.parse(localStorage.getItem(STATE_KEY)) || {};

        // DOM Elements
        const daySelector = document.getElementById('day-selector');
        const blocksContainer = document.getElementById('blocks-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const currentDayDisplay = document.getElementById('current-day-display');
        const scratchpad = document.getElementById('scratchpad');
        const saveIndicator = document.getElementById('save-indicator');

        // Initialize Scratchpad
        scratchpad.value = localStorage.getItem('placement_survival_notes') || '';
        scratchpad.addEventListener('input', (e) => {
            localStorage.setItem('placement_survival_notes', e.target.value);
            saveIndicator.classList.replace('text-amber-600/0', 'text-amber-600/100');
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => {
                saveIndicator.classList.replace('text-amber-600/100', 'text-amber-600/0');
            }, 1000);
        });

        // Render Day Buttons
        function renderDays() {
            daySelector.innerHTML = DAYS.map(day => `
                <button onclick="setActiveDay('${day.id}')" 
                    class="flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition-all
                    ${activeDay === day.id 
                        ? 'bg-gray-900 text-white shadow-md' 
                        : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}">
                    ${day.name} ${day.sprint ? '🔥' : ''}
                </button>
            `).join('');
            
            const dayObj = DAYS.find(d => d.id === activeDay);
            currentDayDisplay.innerHTML = `${dayObj.name} Schedule ${dayObj.sprint ? '<span class="text-orange-500 ml-1">🔥 Sprint Day</span>' : ''}`;
            
            // Auto scroll day selector to active item
            const activeBtn = daySelector.children[DAYS.findIndex(d => d.id === activeDay)];
            if(activeBtn) {
                daySelector.scrollTo({
                    left: activeBtn.offsetLeft - daySelector.offsetWidth/2 + activeBtn.offsetWidth/2,
                    behavior: 'smooth'
                });
            }
        }

        // Toggle task checkbox state
        function toggleTask(taskId) {
            checkedTasks[taskId] = !checkedTasks[taskId];
            localStorage.setItem(STATE_KEY, JSON.stringify(checkedTasks));
            updateProgress();
        }

        // Render Time Blocks
        function renderBlocks() {
            const blocks = generateDayData(activeDay);
            
            blocksContainer.innerHTML = blocks.map(block => {
                return `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <div class="px-4 py-3 bg-gray-50/70 border-b border-gray-100 flex items-center gap-3">
                        <div class="p-2 bg-white rounded-xl shadow-sm border border-gray-100">${block.icon}</div>
                        <div>
                            <h2 class="text-sm font-bold text-gray-900">${block.title}</h2>
                            <p class="text-xs font-semibold text-emerald-600 mt-0.5">${block.time}</p>
                        </div>
                    </div>
                    <div class="p-2">
                        ${block.tasks.map((task, idx) => {
                            const taskId = `${activeDay}_${block.id}_t${idx}`;
                            const isChecked = checkedTasks[taskId];
                            return `
                            <label class="flex items-start gap-4 p-3 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors group">
                                <div class="relative flex items-center justify-center flex-shrink-0 mt-0.5">
                                    <input type="checkbox" class="peer sr-only" ${isChecked ? 'checked' : ''} onchange="toggleTask('${taskId}')">
                                    <div class="check-circle w-7 h-7 rounded-full border-[2.5px] border-gray-300 bg-white flex items-center justify-center group-hover:border-gray-400">
                                        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                        </svg>
                                    </div>
                                </div>
                                <span class="task-label text-sm font-medium text-gray-700 leading-snug pt-1">${task}</span>
                            </label>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }).join('');
            
            updateProgress();
        }

        // Calculate and Render Progress Bar
        function updateProgress() {
            const blocks = generateDayData(activeDay);
            let total = 0;
            let completed = 0;
            
            blocks.forEach(block => {
                block.tasks.forEach((_, idx) => {
                    total++;
                    const taskId = `${activeDay}_${block.id}_t${idx}`;
                    if (checkedTasks[taskId]) completed++;
                });
            });
            
            const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
            progressBar.style.width = `${pct}%`;
            progressText.textContent = `${pct}%`;
            
            if (pct === 100 && total > 0) {
                progressBar.classList.replace('bg-emerald-500', 'bg-blue-500');
                progressText.classList.replace('text-emerald-600', 'text-blue-600');
            } else {
                progressBar.classList.replace('bg-blue-500', 'bg-emerald-500');
                progressText.classList.replace('text-blue-600', 'text-emerald-600');
            }
        }

        // Handle Day Selection
        function setActiveDay(dayId) {
            activeDay = dayId;
            renderDays();
            renderBlocks();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Run Initialization
        renderDays();
        renderBlocks();
    </script>
</body>
</html>
